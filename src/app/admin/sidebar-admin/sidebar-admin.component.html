<mat-nav-list class="admin-options">

    <a mat-list-item [routerLink]="['/admin']" routerLinkActive="router-link-active" routerLinkActive="list-item-active"
        [routerLinkActiveOptions]="{exact: true}">
        <span matListItemIcon>
            <svg xmlns="https://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-tool" width="20" height="20"
                viewBox="0 0 24 24" stroke-width="1.5" stroke="#ffffff" fill="none" stroke-linecap="round"
                stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />

            </svg>
        </span>
        <span matListItemTitle>Administración</span>
    </a>

    <a *ngIf="authService.auth.perfilUsuario === 'ADMIN'" mat-list-item [routerLink]="['/admin/upload-flights']"
        routerLinkActive="list-item-active">
        <span matListItemIcon>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-upload">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2 -2v-2" />
                <path d="M7 9l5 -5l5 5" />
                <path d="M12 4l0 12" />
            </svg>
        </span>
        <span matListItemTitle>Cargar Vuelos por archivo</span>
    </a>

    <a *ngIf="authService.auth.perfilUsuario === 'ADMIN'" mat-list-item [routerLink]="['/admin/upload-analysis']"
        routerLinkActive="list-item-active">
        <span matListItemIcon>
            <svg xmlns="https://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-stack" width="20" height="20"
                viewBox="0 0 24 24" stroke-width="1.5" stroke="#ffffff" fill="none" stroke-linecap="round"

                <path stroke="none" d="M0 0h24v24H0z" fill="none" />

    <a *ngIf="authService.auth.perfilUsuario === 'ADMIN'" mat-list-item [routerLink]="['/admin/indexes']"
        routerLinkActive="list-item-active">
        <span matListItemIcon>
            <svg xmlns="https://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-plant-2" width="20" height="20"
                viewBox="0 0 24 24" stroke-width="1.5" stroke="#ffffff" fill="none" stroke-linecap="round"
                stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M2 9a10 10 0 1 0 20 0" />
                <path d="M12 19a10 10 0 0 1 10 -10" />
                <path d="M2 9a10 10 0 0 1 10 10" />
                <path d="M12 4a9.7 9.7 0 0 1 2.99 7.5" />
                <path d="M9.01 11.5a9.7 9.7 0 0 1 2.99 -7.5" />
            </svg>
        </span>
        <span matListItemTitle>Gestionar Índices</span>
    </a>

    <a *ngIf="authService.auth.perfilUsuario === 'ADMIN'" mat-list-item [routerLink]="['/admin/agrochemicals']"
        routerLinkActive="list-item-active">
        <span matListItemIcon>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"
                class="icon icon-tabler icons-tabler-filled icon-tabler-flask">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />

        </span>

    </a>

    <a *ngIf="authService.auth.perfilUsuario === 'ADMIN'" mat-list-item [routerLink]="['/admin/adjuvants']"

        <span matListItemIcon>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor"

            </svg>

    <a *ngIf="authService.auth.perfilUsuario === 'ADMIN'" mat-list-item [routerLink]="['/admin/users']"
        routerLinkActive="list-item-active">
        <span matListItemIcon>
            <svg xmlns="https://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-users" width="20" height="20"
                viewBox="0 0 24 24" stroke-width="1.5" stroke="#ffffff" fill="none" stroke-linecap="round"
                stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />

                <path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />

                <path d="M21 21v-2a4 4 0 0 0 -3 -3.85" />
            </svg>
        </span>
        <span matListItemTitle>Gestionar Usuarios</span>
    </a>

    <a *ngIf="authService.auth.perfilUsuario === 'ADMIN' || authService.auth.perfilUsuario === 'PILOTO' || authService.auth.perfilUsuario === 'ADMINISTRATIVO'"
        mat-list-item [routerLink]="['/admin/flights-admin']" routerLinkActive="list-item-active">
        <span matListItemIcon>
            <svg xmlns="https://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-drone" width="20" height="20"

                <path d="M9.96 6a3.5 3.5 0 1 0 -3.96 3.96" />
                <path d="M14 10l3.5 -3.5" />
                <path d="M18 9.96a3.5 3.5 0 1 0 -3.96 -3.96" />
                <line x1="14" y1="14" x2="17.5" y2="17.5" />
                <path d="M14.04 18a3.5 3.5 0 1 0 3.96 -3.96" />
                <line x1="10" y1="14" x2="6.5" y2="17.5" />
                <path d="M6 14.04a3.5 3.5 0 1 0 3.96 3.96" />
            </svg>
        </span>
        <span matListItemTitle>Gestionar vuelos</span>
    </a>

    <a *ngIf="authService.auth.perfilUsuario === 'ADMIN' || authService.auth.perfilUsuario === 'PILOTO'"
        mat-list-item [routerLink]="['/admin/orden-pedido']" routerLinkActive="list-item-active">
        <span matListItemIcon>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-calendar-week">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12" />

                <path d="M7 14h.013" />
                <path d="M10.01 14h.005" />
                <path d="M13.01 14h.005" />
                <path d="M16.015 14h.005" />
                <path d="M13.015 17h.005" />
                <path d="M7.01 17h.005" />
                <path d="M10.01 17h.005" />
            </svg>
        </span>
        <span matListItemTitle>Órdenes de Pedido</span>
    </a>

    <a *ngIf="authService.auth.perfilUsuario === 'ADMIN' || authService.auth.perfilUsuario === 'ADMINISTRATIVO'"
        mat-list-item [routerLink]="['/admin/remito-admin']" routerLinkActive="list-item-active">
        <span matListItemIcon>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-receipt">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path
                    d="M5 21v-16a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v16l-3 -2l-2 2l-2 -2l-2 2l-2 -2l-3 2m4 -14h6m-6 4h6m-2 4h2" />
            </svg>
        </span>
        <span matListItemTitle>Gestionar Remitos</span>
    </a>

    <a *ngIf="authService.auth.perfilUsuario === 'ADMIN' || authService.auth.perfilUsuario === 'ADMINISTRATIVO'"
        mat-list-item [routerLink]="['/admin/gestion-admin']" routerLinkActive="list-item-active">
        <span matListItemIcon>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="icon icon-tabler icons-tabler-outline icon-tabler-receipt-dollar">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M5 21v-16a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v16l-3 -2l-2 2l-2 -2l-2 2l-2 -2l-3 2" />

                <path d="M12 6v10" />
            </svg>
        </span>
        <span matListItemTitle>Gestión administrativa</span>
    </a>

    <a *ngIf="authService.auth.perfilUsuario === 'ADMIN'" mat-list-item [routerLink]="['/admin/backups']"
        routerLinkActive="list-item-active">
        <span matListItemIcon>
            <svg xmlns="https://www.w3.org/2000/svg" class="icon icon-tabler icon-tabler-database" width="20" height="20"
                viewBox="0 0 24 24" stroke-width="1.5" stroke="#ffffff" fill="none" stroke-linecap="round"
                stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <ellipse cx="12" cy="6" rx="8" ry="3"></ellipse>
                <path d="M4 6v6a8 3 0 0 0 16 0v-6" />
                <path d="M4 12v6a8 3 0 0 0 16 0v-6" />
            </svg>
        </span>
        <span matListItemTitle>Copias de Seguridad</span>
    </a>

</mat-nav-list>

<!-- Footer -->
<div class="sidebar__footer">
    <!-- Toggle -->
    <div [ngClass]="{'display-none': this.sidebarService.extendedSidebar}" class="sidebar__toggle"
        (click)="this.sidebarService.toggleSidebar()">
        <svg xmlns="https://www.w3.org/2000/svg" class="icon-hover icon icon-tabler icon-tabler-chevrons-right"
            width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="#ffffff" fill="none"
            stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <polyline points="7 7 12 12 7 17" />
            <polyline points="13 7 18 12 13 17" />
        </svg>
    </div>
    <div [ngClass]="{'display-none': !this.sidebarService.extendedSidebar}" class="sidebar__toggle pointer"
        (click)="this.sidebarService.toggleSidebar()">
        <svg xmlns="https://www.w3.org/2000/svg" class="icon-hover icon icon-tabler icon-tabler-chevrons-left"
            width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="#ffffff" fill="none"
            stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <polyline points="11 7 6 12 11 17" />
            <polyline points="17 7 12 12 17 17" />
        </svg>
    </div>
    <!-- END Toggle -->
</div>
